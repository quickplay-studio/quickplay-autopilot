name: write
# The script writer (pipeline/writer.py, Gemini): runs after every trends run (04:23, 10:47 and 18:23 UTC), so the fact
# packs are fresh, then starts the render. Test by pushing requests/write.txt with e.g. "dry 2" (2 boards, never uploaded).
on:
  workflow_run:
    workflows: [trends]
    types: [completed]
  push:
    branches: [main]
    paths: ['requests/write*']
  workflow_dispatch:
    inputs:
      count: { description: 'How many Shorts (blank: the run''s normal number)', required: false, default: '' }
      dry: { description: 'Type dry to hold them for approval and never upload', required: false, default: '' }

permissions:
  contents: write
  actions: write

concurrency:
  group: write
  cancel-in-progress: false

jobs:
  write:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q requests tzdata cryptography google-api-python-client==2.* google-auth==2.*
      - name: Write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IN_COUNT: ${{ inputs.count }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          req=""; [ "${{ github.event_name }}" = "push" ] && req=$(head -1 requests/write.txt 2>/dev/null)
          export WRITE_COUNT="${IN_COUNT:-$(echo "$req" | grep -o '[0-9]\+' | head -1)}"
          case "$IN_DRY $req" in *dry*) export WRITE_DRY=1;; esac
          set -o pipefail
          python pipeline/writer.py 2>&1 | tee status/write_log.txt
      - name: Save and render
        if: ${{ always() }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add boards/queue
          git add status/write_log.txt 2>/dev/null || true
          git add status/quota 2>/dev/null || true
          new=$(git diff --cached --name-only -- boards/queue | wc -l)
          git commit -q -m "Gemini boards $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && break; sleep $((5 + RANDOM % 10)); done
          [ "$new" -gt 0 ] && gh workflow run render.yml --ref main || true    # a push made by this job can't start render.yml itself
