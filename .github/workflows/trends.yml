name: trends
# Daily trend shortlist for the script writer (trends/latest.json). Small dependency set; read-only use of the YouTube keys.
on:
  schedule:
    - cron: '35 5 * * *'      # about 06:35 UK
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q requests google-api-python-client==2.* google-auth==2.*
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/trends.py
      - run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add trends
          git commit -q -m "Trends $(date -u +%F)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 7; done
          exit 1
