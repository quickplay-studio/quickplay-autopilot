name: alerts
# A GitHub issue when something needs a look (pipeline/alerts.py): a job failing twice in a row, a day short of its
# Shorts, or the Facebook key about to run out. The GitHub app on Charlie's phone notifies him; issues close themselves
# once things work again.
on:
  workflow_run:
    workflows: [trends, write, render, publish, social, engage, analytics, weekly, clips, policy, audit]
    types: [completed]
  schedule:
    - cron: '30 21 * * *'      # the evening check: did the day's Shorts go out?
    - cron: '40 */2 * * *'     # every 2 hours: closes "is failing" issues whose job has run successfully since (alerts.recovered)
  workflow_dispatch:

permissions:
  contents: write      # status/money.json
  issues: write
  actions: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    # a runner only for a failed run, the evening check and the 2-hourly recovery check: until 24 October every finished
    # run of these 11 workflows started one (about 160 a day, a third of the Actions list); a success needs no alert, and
    # the recovery check closes a job's "is failing" issue once it works again (audit P5)
    if: ${{ github.event_name != 'workflow_run' || contains(fromJSON('["failure", "timed_out", "startup_failure"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10      # runs take seconds
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 pipeline/alerts.py
      - name: Save
        if: ${{ always() }}
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add status/money.json status/fx.json 2>/dev/null || true
          git add status/funnel.json analytics/funnel.csv 2>/dev/null || true
          git commit -q -m "Money note $(date -u '+%F %H:%M')" || exit 0
          git config merge.qp.driver "python3 pipeline/merge_driver.py %O %A %B %P"      # status, submit.csv and hourly.csv merge by key (pipeline/merge_driver.py)
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 0
