name: trends
# Trend shortlist for the morning sessions (trends/latest.json), the channel report (status/channel.json)
# and the review page (review/README.md). Small dependency set; read-only use of the YouTube keys.
# Runs before each morning session, and whenever a file under requests/ is pushed (an on-demand refresh).
on:
  schedule:
    - cron: '23 4 * * *'      # trends and fact packs ready well before the 06:50 UK session
    - cron: '47 10 * * *'     # before the 12:50 UK session
    - cron: '23 18 * * *'     # before the 20:50 UK session, and evening numbers for the stats dashboard
    - cron: '47 6,8,12,14,16 * * *'   # breaking-news checks between them: 6 topics, at most 2 Shorts (write.yml)
  push:
    branches: [main]
    paths: ['requests/refresh*']     # only a refresh request: other request files belong to other jobs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q requests cryptography tzdata trafilatura google-api-python-client==2.* google-auth==2.*
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          BREAKING: ${{ github.event.schedule == '47 6,8,12,14,16 * * *' && '1' || '' }}
          FACTPACK_TOPICS: ${{ github.event.schedule == '47 6,8,12,14,16 * * *' && '6' || '' }}
        run: |
          python pipeline/trends.py
          python pipeline/factpack.py build 2>&1 | tee status/factpack_log.txt || echo "fact packs failed"
          python pipeline/report.py || echo "channel report failed"
          [ -n "$BREAKING" ] || python pipeline/analytics.py || echo "analytics failed"
          python pipeline/review_page.py || echo "review page failed"
      - run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add -A trends status review analytics
          git commit -q -m "Trends and channel report $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5 6; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 15)); done
          exit 1
