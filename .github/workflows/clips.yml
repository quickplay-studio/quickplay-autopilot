name: clips
# Quickplay Clips (pipeline/clips.py): clips from campaign-permitted footage (clips/campaigns.json), made at 12:00 UTC and
# public together at batch_time (19:00 UK); the batch run then posts them to Instagram and Facebook, comments, and submits every link
# to its campaign itself (pipeline/submit.py, with the studio's sign-ins from tokens/, see logins.yml; what it cannot
# submit stays on the phone page). Test by pushing requests/clips.txt with "test 2" (2 private uploads, no publish time);
# "stats" refreshes clips/stats.csv only; "submit" puts the public links into their campaigns now ("submit probe" only
# checks the sign-ins work); "promote" schedules the last 48 hours' private test clips into the next batch; "outreach" runs
# the creator scout now (clips/outreach.csv; it also runs weekly with the 08:35 UTC scout).
on:
  schedule:
    # crons are UTC: UK time is an hour later in summer (BST) and the same in winter (GMT, from 25 October 2026)
    - cron: '0 9 * * *'        # 10:00 UK in summer, 09:00 in winter: footage and transcripts ready for the day (sources cut once, kept as release assets)
    - cron: '0 12 * * *'       # 13:00 UK in summer, 12:00 in winter: the day's clips, public together at the 19:00 UK batch
    - cron: '31 16,17,18 * * *'   # before the 19:00 UK batch: a run waits for 19:01 UK when the batch is under 100 minutes away (in summer the 16:31 and 17:31 runs, in winter 17:31 and 18:31; GitHub starts crons 20 to 60 minutes late and can drop one), then Instagram, Facebook, TikTok, comments, submissions; a later run repeats only what is left
    - cron: '30 22 * * *'      # views per clip for the learning data
    - cron: '35 8 * * *'       # 09:35 UK in summer, 08:35 in winter: the scout (campaigns ranked by money and heat, the viral streamers), for the evening's Chrome jobs
  push:
    branches: [main]
    paths: ['requests/clips*']
  workflow_dispatch:
    inputs:
      count: { description: 'How many clips per campaign (blank: per_day)', required: false, default: '' }
      mode: { description: 'private for a test upload with no publish time', required: false, default: '' }

permissions:
  contents: write
  issues: write      # the expired-login issue (alerts.py)

concurrency:
  group: clips
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"     # clips.py stops starting new campaigns 135 minutes after this
      - name: Identity guard
        run: python3 pipeline/identity.py gate      # stops while the last audit found a sign-in outside the studio account
      - name: Batch time?
        id: when
        # a social run that starts over 100 minutes before the batch has nothing to do: it stops here, before apt, pip and
        # Playwright (in winter the 16:31 UTC run is 2.5 hours early; audit L2). The Clips step makes the same check.
        run: |
          skip=0
          if [ "${{ github.event.schedule }}" = "31 16,17,18 * * *" ]; then
            wait=$(python3 -c "import json,datetime as d,zoneinfo as z;u=z.ZoneInfo('Europe/London');n=d.datetime.now(u);h,m=map(int,json.load(open('clips/campaigns.json')).get('batch_time','19:00').split(':'));t=n.replace(hour=h,minute=m,second=0,microsecond=0)+d.timedelta(minutes=1);w=(t-n).total_seconds();print(-1 if w>6000 else max(0,int(w)))" || echo 0)
            if [ "$wait" = "-1" ]; then skip=1; echo "social: the batch is over 100 minutes away; the later run posts it"; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.when.outputs.skip != '1'
        with: { python-version: '3.12' }
      - if: steps.when.outputs.skip != '1'
        run: |
          # only what the runner is missing: its image already carries ffmpeg and the DejaVu fonts, and on 23 and 24 October a
          # slow Ubuntu mirror made this step take 37 minutes on the clips job and over 20 on a render; apt also retries and is capped.
          need=""
          for p in ffmpeg fonts-dejavu-core; do dpkg -s "$p" >/dev/null 2>&1 || need="$need $p"; done
          if [ -n "$need" ]; then
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            timeout 600 sudo apt-get $APT update -q || echo "apt update was slow or failed; installing from the runner's lists"
            timeout 900 sudo apt-get $APT install -y -q $need
          else echo "system packages already on the runner"; fi
          python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests cryptography gdown faster-whisper playwright Pillow "opencv-python-headless<5" google-api-python-client==2.* google-auth==2.* tzdata
          timeout 900 python -m playwright install --with-deps chromium >/dev/null 2>&1 || timeout 600 python -m playwright install chromium
          sudo mkdir -p /mnt/clips && sudo chown "$USER" /mnt/clips
      # our own take on every clip (23 October): the Daily Shorts' voice (Chatterbox) reads the intro and the reaction,
      # installed only for the runs that make clips. Since 25 October the clips are commentary Shorts rendered by the Daily
      # pipeline (pipeline/commentary.py, run_board.py), so this run also needs what a Daily render needs: Node for the fonts and
      # icons (npm ci), the music library (unlocked with MUSIC_KEY), trafilatura for the Wikipedia pack of each campaign's subject
      - uses: actions/setup-node@v4
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        with: { node-version: 20 }
      - name: Voice packages
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        run: |
          python -m pip install -q pip==26.2.1 && python -m pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D -r pipeline/requirements.txt
          python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D --no-deps chatterbox-tts==0.1.7
          python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D trafilatura
          npm ci --prefix pipeline --silent
      - name: Unlock music
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        env: { MUSIC_KEY: '${{ secrets.MUSIC_KEY }}' }
        run: for f in pipeline/music/*.mp3.enc; do [ -f "$f" ] || continue; openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "${f%.enc}" -pass env:MUSIC_KEY; done
      - uses: actions/cache@v4
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        with: { path: models/chatterbox, key: chatterbox-5bb1f6e }
      - name: Voice model
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        run: python pipeline/get_model.py models/chatterbox && echo "CB_CKPT=$GITHUB_WORKSPACE/models/chatterbox" >> "$GITHUB_ENV"
      # faster-whisper's "small" model (about 460 MB from Hugging Face) for the runs that transcribe footage: kept between
      # runs instead of downloaded each time (audit L2)
      - uses: actions/cache@v4
        if: ${{ steps.when.outputs.skip != '1' && (github.event.schedule == '0 9 * * *' || github.event.schedule == '0 12 * * *' || github.event_name != 'schedule') }}
        with: { path: ~/.cache/huggingface, key: whisper-small-v1 }
      # YuNet face detector (24 October; 232 KB, SHA-256 pinned in pipeline/get_pictures.py) for the person finder, clips.face_box;
      # the Haar cascade stands in when the file is missing, and a failure here never fails the run
      - uses: actions/cache/restore@v4
        id: yunet_cache
        if: steps.when.outputs.skip != '1'
        with: { path: models/yunet, key: yunet-2023mar-8f2383e }
      - name: Face model
        if: steps.when.outputs.skip != '1'
        run: python pipeline/get_pictures.py models --only yunet
      - uses: actions/cache/save@v4
        if: ${{ steps.when.outputs.skip != '1' && steps.yunet_cache.outputs.cache-hit != 'true' && hashFiles('models/yunet/face_detection_yunet_2023mar.onnx') != '' }}
        with: { path: models/yunet, key: yunet-2023mar-8f2383e }
      - name: Clips
        if: steps.when.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          IG_CLIPS_TOKEN: ${{ secrets.IG_CLIPS_TOKEN }}
          IG_CLIPS_USER_ID: ${{ secrets.IG_CLIPS_USER_ID }}
          FB_CLIPS_PAGE_TOKEN: ${{ secrets.FB_CLIPS_PAGE_TOKEN }}
          FB_CLIPS_PAGE_ID: ${{ secrets.FB_CLIPS_PAGE_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          IG_GAMING_TOKEN: ${{ secrets.IG_GAMING_TOKEN }}        # one line per clips channel: its Instagram and Facebook keys, named here one by one
          IG_GAMING_USER_ID: ${{ secrets.IG_GAMING_USER_ID }}
          FB_GAMING_PAGE_TOKEN: ${{ secrets.FB_GAMING_PAGE_TOKEN }}
          FB_GAMING_PAGE_ID: ${{ secrets.FB_GAMING_PAGE_ID }}
          IG_IRL_TOKEN: ${{ secrets.IG_IRL_TOKEN }}
          IG_IRL_USER_ID: ${{ secrets.IG_IRL_USER_ID }}
          FB_IRL_PAGE_TOKEN: ${{ secrets.FB_IRL_PAGE_TOKEN }}
          FB_IRL_PAGE_ID: ${{ secrets.FB_IRL_PAGE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}        # a commentary Short is rendered by the Daily pipeline (stock video fallback, background)
          CLIPS_WORK: /mnt/clips
          TQDM_DISABLE: '1'
          IN_COUNT: ${{ inputs.count }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          req=""; [ "${{ github.event_name }}" = "push" ] && req=$(head -1 requests/clips.txt 2>/dev/null)
          export CLIPS_COUNT="${IN_COUNT:-$(echo "$req" | grep -o '[0-9]\+' | head -1)}"
          case "$IN_MODE $req" in *private*|*test*) export CLIPS_MODE=private;; esac
          for kv in $(echo "$req" | grep -oE '(layout|captions|punch)=[a-z]+'); do export CLIPS_$(echo "${kv%%=*}" | tr a-z A-Z)="${kv#*=}"; done
          set -o pipefail
          # the log keeps the last few runs (24 October: three runs around the batch each overwrote the one before, so the
          # run that posted the Reels and tried the submissions could not be read): trimmed to 400 lines, one header a run
          mkdir -p status; tail -n 400 status/clips_log.txt > status/clips_log.tmp 2>/dev/null || true; mv -f status/clips_log.tmp status/clips_log.txt
          echo "=== run $(date -u '+%F %H:%M') UTC, schedule '${{ github.event.schedule }}', request '$req'" >> status/clips_log.txt
          if [ "${{ github.event.schedule }}" = "30 22 * * *" ] || echo "$req" | grep -qi stats; then
            python pipeline/clips.py stats 2>&1 | tee -a status/clips_log.txt
          elif [ "${{ github.event.schedule }}" = "35 8 * * *" ] || echo "$req" | grep -qiE 'scout|outreach'; then
            # the creator scout (25 October): small creators who say clips are allowed -> clips/outreach.csv, for Charlie to read on the
            # hub's Clips tab; nothing is sent. Once a week by its own gate (the other six days it says so and stops); "outreach" in
            # a request runs it now and alone; a failure here never fails the scout that follows
            if echo "$req" | grep -qi outreach; then
              python pipeline/outreach.py --force 2>&1 | tee -a status/clips_log.txt || true
            else
              python pipeline/outreach.py 2>&1 | tee -a status/clips_log.txt || true
              python pipeline/submit.py scout 2>&1 | tee -a status/clips_log.txt
            fi
          elif echo "$req" | grep -qi demote; then        # "demote 2026-10-23T22:00+00:00": promoted test clips from before it go private again
            python pipeline/clips.py demote $(echo "$req" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9:+]+' | head -1) 2>&1 | tee -a status/clips_log.txt
          elif echo "$req" | grep -qi promote; then
            python pipeline/clips.py promote $(echo "$req" | grep -oE '20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9:+]+' | head -1) 2>&1 | tee -a status/clips_log.txt      # private test clips join the next batch
          elif echo "$req" | grep -qi submit; then
            case "$req" in *probe*|*dry*) export SUBMIT_DRY=1;; esac
            python pipeline/clips.py submit 2>&1 | tee -a status/clips_log.txt
          elif [ "${{ github.event.schedule }}" = "31 16,17,18 * * *" ] || echo "$req" | grep -qi social; then
            case "$req" in *social*) export CLIPS_SOCIAL_NOW=1;; esac
            # 23 October: this branch never ran (the schedule string here did not match the cron), so no clip was ever posted
            # to Instagram or submitted. Now: wait for 19:01 UK when the batch is under 100 minutes away; a later start runs at once.
            wait=$(python -c "import json,datetime as d,zoneinfo as z;u=z.ZoneInfo('Europe/London');n=d.datetime.now(u);h,m=map(int,json.load(open('clips/campaigns.json')).get('batch_time','19:00').split(':'));t=n.replace(hour=h,minute=m,second=0,microsecond=0)+d.timedelta(minutes=1);w=(t-n).total_seconds();print(-1 if w>6000 else max(0,int(w)))")
            if [ -z "$CLIPS_SOCIAL_NOW" ] && [ "$wait" = "-1" ]; then echo "social: the batch is over 100 minutes away; the later run posts it" | tee -a status/clips_log.txt
            else [ -z "$CLIPS_SOCIAL_NOW" ] && echo "social: waiting $wait s for the batch" && sleep "$wait"
              python pipeline/clips.py social 2>&1 | tee -a status/clips_log.txt; fi
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ] || echo "$req" | grep -qi prepare; then
            case "$req" in *redo*) export CLIPS_REDO=1;; esac
            python pipeline/clips.py prepare $(echo "$req" | tr ' ' '\n' | grep -E '^[a-z]+-[a-z0-9-]+$' | tr '\n' ' ') 2>&1 | tee -a status/clips_log.txt
          elif echo "$req" | grep -qi probe; then
            python pipeline/clips.py probe $(echo "$req" | grep -o 'https://[^ ]*') 2>&1 | tee -a status/clips_log.txt
          else
            python pipeline/clips.py run $(echo "$req" | tr ' ' '\n' | grep -E '^[a-z]+-[a-z0-9-]+$' | tr '\n' ' ') 2>&1 | tee -a status/clips_log.txt
          fi
      - name: Save
        if: ${{ always() }}
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git config merge.directoryRenames false      # an emptied boards/queue is not a renamed folder (a board was lost that way, 22 October)
          mkdir -p clips/plans status/quota
          for f in clips/plans clips/frames clips/state boards/clips clips/campaigns.json clips/submit.csv clips/stats.csv clips/insights.json clips/reach.json status/clips_log.txt status/quota status/probe_*.html status/probe_*.png status/submit_*.png status/scout.md status/scout_vyro.txt status/streamers.md clips/scout.json analytics/late_uploads.csv analytics/decisions.csv clips/outreach.csv; do git add $f 2>/dev/null || true; done
          git commit -q -m "Clips $(date -u '+%F %H:%M')" || exit 0
          git config merge.qp.driver "python3 pipeline/merge_driver.py %O %A %B %P"      # status, submit.csv and hourly.csv merge by key (pipeline/merge_driver.py)
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
