name: pages
# The hub and its public pages (docs/*.html) on GitHub Pages, now from a public repo (28 October 2026). This repository is
# private and GitHub's free plan serves Pages only from public repositories, so pipeline/pages_sync.py copies an explicit
# allowlist (docs/*.html and the static files those pages reference, never a Markdown, JSON, CSV or data file) into
# quickplay-studio/quickplay-studio.github.io, folder quickplay-autopilot/, which serves at the same addresses as before
# (https://quickplay-studio.github.io/quickplay-autopilot/hub.html). The hub reads its data from this private repository in
# the browser with a read-only token that only Charlie holds.
# Runs when docs/ changes, once a day (pushes made by the workflows' own token start no workflow, so a docs file a
# workflow wrote reaches the site with the next daily run) and from Run workflow. HUB_PUSH_TOKEN is a fine-grained token with
# Contents read and write on the public repo only. Without it, or before that repo exists, the run prints one line and
# passes: nothing else depends on it.
on:
  push:
    branches: [main]
    paths: ['docs/**', 'pipeline/pages_sync.py', '.github/workflows/pages.yml']
  schedule:
    - cron: '37 5 * * *'       # every day, 05:37 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            /docs/
            /pipeline/pages_sync.py
          sparse-checkout-cone-mode: false
      - name: Copy the allowlisted pages to the public site repo
        env:
          HUB_PUSH_TOKEN: ${{ secrets.HUB_PUSH_TOKEN }}
        run: python3 pipeline/pages_sync.py
