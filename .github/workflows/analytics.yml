name: analytics
# Fresh numbers every hour (pipeline/analytics.py --fast): view counts on every platform, views gained this hour by
# category (analytics/hourly.csv) and each new Short's hour-by-hour curve (analytics/curves/). The slower full read
# (YouTube Analytics retention, countries and traffic, drivers, insights.md) runs with trends three times a day.
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write      # the change ledger's trade-off issue (pipeline/changes.py); also lets hub_md.py read the needs-charlie issues

concurrency:
  group: analytics
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests cryptography tzdata google-api-python-client==2.* google-auth==2.*
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          python pipeline/analytics.py --fast
          python pipeline/dropoff.py || echo "drop-off analysis failed"
      - run: python pipeline/lab.py || echo "look lab failed"     # new looks to test, once a day
      # the change ledger (analytics/changes.csv): before and after for every change past its check day, guardrails
      # included; a trade-off opens an issue (pipeline/changes.py)
      - name: Change ledger
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/changes.py check || echo "change ledger failed"
      # the hub inside GitHub (pipeline/hub_md.py, 28 October): README.md, the repo front page, rebuilt from the files just written;
      # it joins the commit below, so no extra commit or push is added. gh reads the open needs-charlie issues (GH_TOKEN).
      - name: Hub front page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/hub_md.py
      - run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git config merge.directoryRenames false      # an emptied boards/queue is not a renamed folder (a board was lost that way, 22 October)
          git add -A analytics; git add status/volume.json 2>/dev/null || true; git add README.md 2>/dev/null || true
          git commit -q -m "Hourly numbers $(date -u '+%F %H:%M')" || exit 0
          git config merge.qp.driver "python3 pipeline/merge_driver.py %O %A %B %P"      # status, submit.csv and hourly.csv merge by key (pipeline/merge_driver.py)
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
