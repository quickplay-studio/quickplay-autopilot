name: music
# Builds the platform-safe music library (pipeline/music_social) used for the TikTok and Instagram versions.
on:
  push:
    branches: [main]
    paths: ['requests/music*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q requests
      - name: Probe
        run: python pipeline/music_probe.py
      - name: Save
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add -A status pipeline/music_social 2>/dev/null || git add -A status
          git commit -q -m "Music library $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
