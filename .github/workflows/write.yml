name: write
# The script writer (pipeline/writer.py): runs after every trends run (08:10, 12:47 and 18:23 UTC), so the fact packs are
# fresh, then starts the render. Models, in order (factpack.gemini): Gemini Flash, Gemma, the keyed free providers (Groq,
# Cerebras, Mistral, OpenRouter: optional secrets), the open model on this runner (llama.cpp), and Claude last (optional
# CLAUDE_CODE_OAUTH_TOKEN secret). Test by pushing requests/write.txt with e.g. "dry 2" (2 boards, never uploaded).
on:
  workflow_run:
    workflows: [trends]
    types: [completed]
  push:
    branches: [main]
    paths: ['requests/write*']
  workflow_dispatch:
    inputs:
      count: { description: 'How many Shorts (blank: the run''s normal number)', required: false, default: '' }
      dry: { description: 'Type dry to hold them for approval and never upload', required: false, default: '' }

permissions:
  contents: write
  actions: write

concurrency:
  group: write
  cancel-in-progress: false

jobs:
  write:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests tzdata cryptography trafilatura google-api-python-client==2.* google-auth==2.*
      - name: Open model on this runner (llama.cpp, used only when every API model is spent)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash pipeline/get_llama.sh
      - name: Claude Code CLI (used last, only with the CLAUDE_CODE_OAUTH_TOKEN secret)
        env: { HAS_CLAUDE: "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && '1' || '' }}" }
        run: |
          [ "$HAS_CLAUDE" = "1" ] || { echo "no CLAUDE_CODE_OAUTH_TOKEN secret: Claude is left out of the chain"; exit 0; }
          # pinned (24 October): the docs say --bare will become -p's default and ignores OAuth sign-ins, so an unpinned newest CLI could
          # one day leave CLAUDE_CODE_OAUTH_TOKEN unused; 2.1.302 was published 16 October (over 7 days ago, the supply-chain rule)
          npm install -g @anthropic-ai/claude-code@2.1.302 --before="$(date -u -d '7 days ago' +%Y-%m-%d)" >/dev/null 2>&1 && claude --version || echo "Claude CLI not installed"
      - name: Write
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # Charlie's monthly API credits: used before the CLI when set (factpack.claude_api)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IN_COUNT: ${{ inputs.count }}
          IN_DRY: ${{ inputs.dry }}
        run: |
          req=""; [ "${{ github.event_name }}" = "push" ] && req=$(head -1 requests/write.txt 2>/dev/null)
          export WRITE_COUNT="${IN_COUNT:-$(echo "$req" | grep -o '[0-9]\+' | head -1)}"
          case "$IN_DRY $req" in *dry*) export WRITE_DRY=1;; esac
          for r in morning afternoon evening; do case " $req " in *" $r "*|*" $r"*|"$r "*) export WRITE_RUN=$r;; esac; done   # "afternoon 8": today's slots
          set -o pipefail
          python pipeline/writer.py 2>&1 | tee status/write_log.txt
      - name: Save and render
        if: ${{ always() }}
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git config merge.directoryRenames false      # an emptied boards/queue is not a renamed folder (a board was lost that way, 22 October)
          git add boards/queue
          git add status/write_log.txt 2>/dev/null || true
          git add status/quota 2>/dev/null || true
          git add status/claude_usage.json 2>/dev/null || true
          git add analytics/mirror_log.csv 2>/dev/null || true      # the Spanish mirror's attempts (pipeline/mirror.py)
          new=$(git diff --cached --name-only -- boards/queue | wc -l)
          git commit -q -m "Gemini boards $(date -u '+%F %H:%M')" || exit 0
          pushed=""
          git config merge.qp.driver "python3 pipeline/merge_driver.py %O %A %B %P"      # status, submit.csv and hourly.csv merge by key (pipeline/merge_driver.py)
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && { pushed=1; break; }; sleep $((5 + RANDOM % 10)); done
          # until 24 October a push that failed five times ended this step green: the boards (and their model calls) were lost
          # with the runner and nothing said so. Now the run fails, so alerts.yml sees it.
          [ -n "$pushed" ] || { echo "::error::the written boards could not be pushed after 5 tries"; exit 1; }
          [ "$new" -gt 0 ] && gh workflow run render.yml --ref main || true    # a push made by this job can't start render.yml itself
