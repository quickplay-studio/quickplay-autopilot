name: trends
# Trend shortlist for the morning sessions (trends/latest.json), the channel report (status/channel.json)
# and the review page (review/README.md). Small dependency set; read-only use of the YouTube keys.
# Runs before each morning session, and whenever a file under requests/ is pushed (an on-demand refresh).
on:
  schedule:
    - cron: '10 8 * * *'      # morning: just after Gemini's daily quota resets (midnight Pacific), so the biggest run gets it
    - cron: '47 12 * * *'     # afternoon: fills whatever the day still needs
    - cron: '23 18 * * *'     # evening: tomorrow's first Shorts (07:30 UK on), and evening numbers for the stats dashboard
    - cron: '47 6,10,15 * * *'   # breaking-news checks between them: 6 topics, a few Shorts at most (write.yml)
  push:
    branches: [main]
    paths: ['requests/refresh*']     # only a refresh request: other request files belong to other jobs
  workflow_dispatch:

permissions:
  contents: write
  issues: write      # the watchlist's "surging" note

jobs:
  trends:
    runs-on: ubuntu-latest
    timeout-minutes: 60      # runs take 2 to 8 minutes; without a limit a hung call holds the job for GitHub's 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests cryptography tzdata trafilatura google-api-python-client==2.* google-auth==2.*
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          BREAKING: ${{ github.event.schedule == '47 6,10,15 * * *' && '1' || '' }}
          FACTPACK_TOPICS: ${{ github.event.schedule == '47 6,10,15 * * *' && '6' || '' }}
          RUN: ${{ github.event.schedule == '10 8 * * *' && 'morning' || github.event.schedule == '47 12 * * *' && 'afternoon' || github.event.schedule == '23 18 * * *' && 'evening' || '' }}
        run: |
          GH_TOKEN="${{ github.token }}" python pipeline/watch.py || echo "watchlist failed"
          python pipeline/trends.py
          python pipeline/factpack.py build 2>&1 | tee status/factpack_log.txt || echo "fact packs failed"
          python pipeline/report.py || echo "channel report failed"
          [ -n "$BREAKING" ] || python pipeline/analytics.py || echo "analytics failed"
          [ -n "$BREAKING" ] || python pipeline/competitors.py || echo "competitors failed"
          python pipeline/review_page.py || echo "review page failed"
      - run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git config merge.directoryRenames false      # an emptied boards/queue is not a renamed folder (a board was lost that way, 22 October)
          git add -A trends status review analytics
          git commit -q -m "Trends and channel report $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5 6; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 15)); done
          exit 1
