name: audit
# The identity guard (pipeline/identity.py): every sign-in the automation holds is resolved live and must belong to the
# studio Google account's own Quickplay channels, pages and profiles; every secret a workflow reads must be on the
# allowlist (config.json "accounts"); the saved campaign-site sign-ins may hold cookies for their own sites only.
# A mismatch opens the issue "Security: a sign-in outside the studio account" and every posting workflow stops at its
# first step (identity.py gate) until the next clean audit.
# Key health (pipeline/keys.py, 24 October): straight after the audit, one row per key and sign-in in status/keys.json
# (ok, expiring, failing or missing, with the day it ends and the steps to fix it; the hub's Accounts tab shows it). It
# reuses the audit's own calls and makes one cheap call per API key. A key that fails or ends within 14 days opens one
# needs-charlie issue with the exact steps, closed again once it works.
# The live action list (pipeline/actions.py): runs each check on status/actions.json (a key pasted, a setting changed,
# the Mac's Vyro run) and marks the item done by itself; each item without a check has one issue, and closing it in the
# GitHub app marks the item done. Hence the issues trigger: closing or reopening a needs-charlie issue runs this within a
# minute (an event made by the workflow's own token starts nothing, so only Charlie's closes do).
# Runs every 3 hours, on Run workflow, on a push of requests/audit.txt, status/actions.json (a new item gets its issue at
# once) or clips/submit.csv (the Mac's Vyro run ticks its item off), and when Charlie closes or reopens a needs-charlie issue.
on:
  schedule:
    - cron: '20 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['requests/audit.txt', 'status/actions.json', 'clips/submit.csv']
  issues:
    types: [closed, reopened]

permissions:
  contents: write
  issues: write
  pages: read       # the action list's pages_workflow check reads how GitHub Pages builds

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    if: ${{ github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'needs-charlie') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests cryptography google-api-python-client==2.* google-auth==2.* tzdata
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_CLIPS_TOKEN: ${{ secrets.IG_CLIPS_TOKEN }}
          IG_CLIPS_USER_ID: ${{ secrets.IG_CLIPS_USER_ID }}
          FB_CLIPS_PAGE_TOKEN: ${{ secrets.FB_CLIPS_PAGE_TOKEN }}
          FB_CLIPS_PAGE_ID: ${{ secrets.FB_CLIPS_PAGE_ID }}
          IG_GAMING_TOKEN: ${{ secrets.IG_GAMING_TOKEN }}
          IG_GAMING_USER_ID: ${{ secrets.IG_GAMING_USER_ID }}
          FB_GAMING_PAGE_TOKEN: ${{ secrets.FB_GAMING_PAGE_TOKEN }}
          FB_GAMING_PAGE_ID: ${{ secrets.FB_GAMING_PAGE_ID }}
          IG_IRL_TOKEN: ${{ secrets.IG_IRL_TOKEN }}
          IG_IRL_USER_ID: ${{ secrets.IG_IRL_USER_ID }}
          FB_IRL_PAGE_TOKEN: ${{ secrets.FB_IRL_PAGE_TOKEN }}
          FB_IRL_PAGE_ID: ${{ secrets.FB_IRL_PAGE_ID }}
        run: python pipeline/identity.py audit 2>&1 | tee status/identity_log.txt || true
      - name: Key health
        # status/keys.json from the audit's facts plus one cheap call per API key; it reads which secrets are set, never what they are
        env:
          GH_TOKEN: ${{ github.token }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_CLIPS_TOKEN: ${{ secrets.IG_CLIPS_TOKEN }}
          IG_GAMING_TOKEN: ${{ secrets.IG_GAMING_TOKEN }}
          IG_IRL_TOKEN: ${{ secrets.IG_IRL_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_CLIPS_PAGE_TOKEN: ${{ secrets.FB_CLIPS_PAGE_TOKEN }}
          FB_GAMING_PAGE_TOKEN: ${{ secrets.FB_GAMING_PAGE_TOKEN }}
          FB_IRL_PAGE_TOKEN: ${{ secrets.FB_IRL_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # Charlie's monthly API credits: used before the CLI when set (factpack.claude_api)
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}      # the optional FreeLLMAPI router keys: only whether each is set is read (keys.router_key_rows)
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          LINKUP_API_KEY: ${{ secrets.LINKUP_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          HUB_PUSH_TOKEN: ${{ secrets.HUB_PUSH_TOKEN }}      # copies the hub to the public site repo (pages.yml): one cheap call reads when it ends
        run: python pipeline/keys.py || true
      - name: Action list
        # status/actions.json: each item's check run (a pasted key proven by one call, the Pages setting, the Mac's Vyro run) and each item's issue read
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: python pipeline/actions.py || true
      - name: Hub front page
        # README.md (pipeline/hub_md.py) shows the fresh keys and actions at once; it fails soft and joins the commit below
        if: ${{ always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/hub_md.py
      - name: Save
        if: ${{ always() }}
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          for f in status/identity.json status/identity_log.txt status/keys.json status/actions.json README.md tokens/instagram_*.enc; do git add $f 2>/dev/null || true; done      # tokens/instagram_<channel>.enc: the channels' Instagram keys, refreshed weekly (social.refresh_meta_keys)
          git commit -q -m "Audit, keys and actions $(date -u '+%F %H:%M')" || exit 0
          git config merge.qp.driver "python3 pipeline/merge_driver.py %O %A %B %P"      # status, submit.csv, hourly.csv and actions.json merge by key (pipeline/merge_driver.py)
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
