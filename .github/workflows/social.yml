name: social
# Posts each Short to TikTok and Instagram once it is public on YouTube, using the platform-safe music version.
# Run it by hand with a TikTok code to connect TikTok (from the connect page). Tokens never appear in the logs.
on:
  schedule:
    - cron: '5,35 * * * *'      # every half hour (Facebook posts one Reel a run, up to Meta's 30 a day); does nothing until SOCIAL_KEY and an Instagram or TikTok sign-in exist
  push:
    branches: [main]
    paths: ['requests/social*']     # push a file here to check the sign-ins (results in status/social.json)
  workflow_dispatch:
    inputs:
      tiktok_code:
        description: 'TikTok code (from the connect page)'
        required: false
        default: ''
      youtube_code:
        description: 'YouTube address or code (from the address bar after allowing access)'
        required: false
        default: ''
      youtube_channel:
        description: 'Which channel that YouTube code is for: main (Quickplay Daily), es (Español), pt (Português) or clips (Quickplay Clips)'
        type: choice
        options: [main, es, pt, clips]
        default: main

permissions:
  contents: write

concurrency:
  group: social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q requests cryptography
      - name: Connect YouTube (comments, playlists, titles)
        # the code comes from the run form, or from requests/social-youtube.txt (pushed for Charlie; deleted straight away)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.youtube_code != '') || github.event_name == 'push' }}
        env:
          YT_INPUT: ${{ inputs.youtube_code }}
          YT_CHANNEL: ${{ inputs.youtube_channel }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          code="$YT_INPUT"
          if [ -z "$code" ] && [ -f requests/social-youtube.txt ]; then
            code=$(tr -d '[:space:]' < requests/social-youtube.txt); git rm -q requests/social-youtube.txt
          fi
          [ -n "$code" ] || exit 0
          YT_CODE="$code" python pipeline/yt_connect.py exchange "${YT_CHANNEL:-main}"
      - name: Connect TikTok
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tiktok_code != '' }}
        env:
          TIKTOK_CODE: ${{ inputs.tiktok_code }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python pipeline/social.py tiktok-connect
      - name: Check sign-ins
        env:
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$SOCIAL_KEY" ]; then mkdir -p status; echo '{"error": "SOCIAL_KEY secret missing"}' > status/social.json; exit 0; fi
          python pipeline/social.py check > /dev/null
          YT_CLIENT_ID="$YT_CLIENT_ID" python pipeline/yt_connect.py link || true
          if grep -q "tiktok-test" requests/social-check.txt 2>/dev/null && [ "${{ github.event_name }}" = "push" ]; then
            TT_TEST_ID=$(grep -o 'tiktok-test [A-Za-z0-9-]*' requests/social-check.txt | cut -d' ' -f2) python pipeline/social.py tiktok-test > /dev/null
          fi
          if grep -qi "dry-run" requests/social-check.txt 2>/dev/null && [ "${{ github.event_name }}" = "push" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
            python pipeline/social.py ig-dry-run > /dev/null
          fi
      - name: Post
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: |
          if [ -z "$SOCIAL_KEY" ]; then echo "SOCIAL_KEY not set yet"; exit 0; fi
          python pipeline/social.py post
      - name: Save
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          mkdir -p tokens; git add -A tokens status
          git commit -q -m "Social posts $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
