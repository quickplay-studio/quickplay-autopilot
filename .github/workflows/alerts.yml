name: alerts
# A GitHub issue when something needs a look (pipeline/alerts.py): a job failing twice in a row, a day short of its
# Shorts, or the Facebook key about to run out. The GitHub app on Charlie's phone notifies him; issues close themselves
# once things work again.
on:
  workflow_run:
    workflows: [trends, write, render, publish, social, engage, analytics, weekly, clips, policy, audit]
    types: [completed]
  schedule:
    - cron: '30 21 * * *'      # the evening check: did the day's Shorts go out?
  workflow_dispatch:

permissions:
  contents: write      # status/money.json
  issues: write
  actions: read

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: python3 pipeline/alerts.py
      - name: Save
        if: ${{ always() }}
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add status/money.json 2>/dev/null || true
          git add status/funnel.json analytics/funnel.csv 2>/dev/null || true
          git commit -q -m "Money note $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 0
