name: music
# Builds the platform-safe music library (pipeline/music_social) used for the TikTok and Instagram versions.
on:
  push:
    branches: [main]
    paths: ['requests/music*', 'pipeline/music_social/picks.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: |
          # retries and time limits: on 23 October a slow package mirror stalled this step for over 35 minutes
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          timeout 600 sudo apt-get $APT update -q || echo "apt update was slow or failed; installing from the runner's lists"
          timeout 900 sudo apt-get $APT install -y -q ffmpeg
      - run: python -m pip install -q pip==26.2.1 && python -m pip install -q --uploaded-prior-to P7D requests numpy librosa soundfile
      - name: Build
        env: { MUSIC_KEY: '${{ secrets.MUSIC_KEY }}' }
        run: |
          mkdir -p status
          python pipeline/music_social_build.py pipeline/music_social/picks.json 2>&1 | tail -n 60 > status/music_build_log.txt
          exit ${PIPESTATUS[0]}
      - name: Save
        if: always()
        run: |
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git config merge.directoryRenames false      # an emptied boards/queue is not a renamed folder (a board was lost that way, 22 October)
          git add -A status pipeline/music_social
          git commit -q -m "Music library $(date -u '+%F %H:%M')" || exit 0
          for i in 1 2 3 4 5; do { git pull -q --rebase -X theirs || git rebase --abort; } && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
