name: render
# Renders queued boards and uploads them. Each job only gets the secrets it needs:
# render (big ML dependency tree) never sees the YouTube keys; upload runs a tiny script with only Google's client library.
on:
  push:
    branches: [main]
    paths: ['boards/queue/**']
  schedule:
    - cron: '20 */3 * * *'      # retry anything still queued (e.g. waiting for the daily upload limit)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.plan.outputs.boards }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q google-api-python-client==2.* google-auth==2.* tzdata
      - id: plan
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/plan.py >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    if: ${{ needs.plan.outputs.boards != '' && needs.plan.outputs.boards != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        job: ${{ fromJson(needs.plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        if: matrix.job.mode != 'reject'
        with: { node-version: 20 }
      - name: System packages
        if: matrix.job.mode != 'reject'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Python packages
        if: matrix.job.mode != 'reject'
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r pipeline/requirements.txt
          pip install -q --no-deps chatterbox-tts==0.1.7
          python -m playwright install --with-deps chromium
      - name: Fonts and icons
        if: matrix.job.mode != 'reject'
        run: npm ci --prefix pipeline --silent
      - uses: actions/cache@v4
        if: matrix.job.mode != 'reject'
        with: { path: models/chatterbox, key: chatterbox-5bb1f6e }
      - name: Voice model
        if: matrix.job.mode != 'reject'
        run: python pipeline/get_model.py models/chatterbox
      - name: Unlock music
        if: matrix.job.mode != 'reject'
        env: { MUSIC_KEY: '${{ secrets.MUSIC_KEY }}' }
        run: for f in pipeline/music/*.mp3.enc; do openssl enc -d -aes-256-cbc -pbkdf2 -in "$f" -out "${f%.enc}" -pass env:MUSIC_KEY; done
      - name: Render
        env:
          JOB_JSON: ${{ toJson(matrix.job) }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CB_CKPT: ${{ github.workspace }}/models/chatterbox
          TQDM_DISABLE: '1'
        run: python pipeline/run_board.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'result-${{ matrix.job.id }}', path: 'result/${{ matrix.job.id }}', retention-days: 7, if-no-files-found: ignore }

  upload:
    needs: render
    if: ${{ always() && needs.render.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: pip install -q google-api-python-client==2.* google-auth==2.*
      - uses: actions/download-artifact@v4
        with: { pattern: 'result-*', path: results }
      - name: Upload to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python pipeline/upload.py results
      - name: Keep statuses
        run: find results -name video.mp4 -delete
      - uses: actions/upload-artifact@v4
        with: { name: statuses, path: results, retention-days: 30 }

  record:
    needs: upload
    if: ${{ always() && needs.upload.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { name: statuses, path: results }
      - name: Commit results
        run: |
          python pipeline/record.py results
          python pipeline/review_page.py
          git config user.name "quickplay-bot"
          git config user.email "quickplay-studio@users.noreply.github.com"
          git add -A boards status review
          git commit -q -m "Results from run ${{ github.run_number }}" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((5 + RANDOM % 10)); done
          exit 1
